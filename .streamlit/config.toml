# 배너 영상(static/hero_snow_camp.mp4)을 주소로 내주려고 켠다(2026-08-28).
# 글자(base64)로 박아 넣으면 화면을 다시 그릴 때마다 3.6MB 가 오간다.
# 주소로 부르면 브라우저가 처음 한 번만 받고 그다음부터 제 창고에서 꺼내 쓴다.
# `static/` 안의 것은 누구나 주소로 볼 수 있다 — 거기에는 영상만 둔다.
[server]
enableStaticServing = true
# 폰·태블릿에서 **다른 앱에 갔다 와도 화면이 그대로** 남게 한다 (2026-09-17 상하님
# 지적 — "스마트폰이나 태블릿에서 멀티화면으로 전환 후 다른 어플 실행 후 다시
# 되돌아가면 또다시 리셋이나 로딩이 걸린다").
# 폰은 다른 앱으로 가면 이 앱과의 연결을 끊는다. 스트림릿은 끊긴 화면을 **120초**만
# 기억하고 버려서, 2분 넘게 있다 돌아오면 열어 둔 것이 다 닫히고 처음부터 다시 그렸다.
# 30분 동안 기억하게 한다. 그 안에 돌아오면 보던 자리 그대로다.
disconnectedSessionTTL = 1800

# 화면을 바꿀 때 **이미 보낸 조각을 또 보내지 않게** 한다 (2026-09-23 밤 · 온라인 실측).
# 스트림릿은 10,000자 넘는 조각만 「이미 가진 것」 표시로 줄여 보내고, 그보다 작은
# 조각(꾸밈 규칙 · 설명 글)은 똑같아도 매번 통째로 보낸다. 시장분석은 한 번 바꿀 때
# 84KB 중 57KB 가 그렇게 또 오는 것이었다. 1,000자 넘는 것부터 줄여 보낸다.
# 화면에 그려지는 것은 한 글자도 안 바뀐다 — 보내는 방식만 바뀐다.
[global]
minCachedMessageSize = 1000
