# 아침에 앱을 미리 깨워 둔다 (2026-09-23 상하님 지시 — "아침 9시 첫 클릭이 너무 오래
# 걸린다 · 새벽에 다 정리해 놓으면 안 되나?").
#
# 온라인 앱은 받아 둔 자료를 그 판(프로세스) 안에만 들고 있다. 아침 목록 저장
# (picklist_collect.yml 08:30 KST)이 끝나며 저장소에 글을 올리면 스트림릿이 앱을
# 껐다 켜서 그 자료가 전부 사라진다. 그래서 **그 뒤에** 한 번 열어 둔다.
# 까닭과 실측은 warm_morning.py 맨 위에 적어 두었다.
#
# cron 은 UTC다. 한국시각 = UTC + 9.
name: 아침에 미리 깨워 두기

on:
  # **목록 저장이 끝날 때마다** 데운다 (2026-09-24 상하님 — "상승장 첫 클릭 로딩 15초 ·
  # 두 번째 1초"). 저장은 하루 일곱 번(미국 넷·한국 셋) 글을 올리고, 올릴 때마다 앱이
  # 껐다 켜진다. 08:50 한 번만 데웠더니 그날 08:51 저장이 다시 껐다 켜서 헛돌았다.
  workflow_run:
    workflows: ["날짜별 목록 저장"]
    types: [completed]
  schedule:
    # 아침 저장(08:30 KST)이 보통 08:40~09:15 사이에 글을 올린다(실측 — 09-19 08:28 ·
    # 09-22 09:13 · 09-23 08:42). 그 뒤에 한 번, 늦게 끝난 날을 위해 한 번 더 깨운다.
    - cron: "50 23 * * 0-4"   # 08:50 KST (월~금)
    - cron: "25 0 * * 1-5"    # 09:25 KST (월~금)
  # **코드를 올린 뒤에도** 데운다 (2026-10-10 상하님 — "깨우기 자비스12도 열고 올린 뒤에도 돌게 해라").
  # 코드를 올리면 앱이 껐다 켜지는데 그 뒤에는 데우는 것이 없어, 첫 사람이 첫 시장분석 24초·첫 테마
  # 39~44초를 기다렸다. 화면 맨 밑 판 표시(build_stamp.py)가 보는 파일과 같은 것이 바뀐 올리기에만 돈다 —
  # 설명서(.md)만 올린 것은 판 표시가 안 바뀌어 새 판을 15분 기다리다 헛돈다. 목록 저장(깃허브 일꾼)이
  # 올린 것은 이 길로 안 온다(깃허브는 일꾼이 올린 것으로 다른 작업을 깨우지 않는다) — 위 workflow_run 이 맡는다.
  push:
    branches: [master]
    paths: ["**.py", "**.bat", "**.toml"]
  workflow_dispatch:

concurrency:
  group: warm-morning
  cancel-in-progress: false

permissions:
  contents: read            # 저장소에 아무것도 안 쓴다. 보기만 한다.

jobs:
  warm:
    # 저장이 실패한 판에는 올린 글이 없어 앱이 안 껐다 켜진다 — 데울 까닭이 없다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 브라우저 하나만 설치
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: 앱 깨우기
        # 실패해도 그날 아침이 예전처럼 느릴 뿐이라 워크플로를 붉게 만들지 않는다.
        continue-on-error: true
        run: |
          # 저장이 막 올린 글(맨 끝 커밋)이 앱에 뜰 때까지 기다린 뒤 데운다(warm_morning.py).
          # 코드를 올린 뒤(push)에는 맨 끝 커밋이 설명서뿐일 수 있다 — 판 표시와 같은 규칙으로
          # **코드 파일을 바꾼 마지막 커밋**을 기다린다(build_stamp._from_git 과 같은 파일들).
          # 목록 저장·아침 시각(그 밖)에는 판 표시를 기다리지 않는다 — 저장은 자료만 올려 판 표시가 안 바뀌어,
          # 예전에는 15분을 다 채우고서야 데웠다(2026-10-10 상하님 「고쳐라」). 대신 맨 끝 커밋 시각보다 늦게 켜진
          # 앱을 기다린다(WAIT_FOR_BOOT_AFTER · 자비스12 밑 막대에 숨긴 켜진 시각 — warm_morning.py).
          git fetch --depth=50 origin master
          if [ "${{ github.event_name }}" = "push" ]; then
            export WAIT_FOR_SHA="$(git log -1 --format=%h FETCH_HEAD -- '*.py' 'pages/*.py' '*.bat' '*.toml')"
          fi
          export WAIT_FOR_BOOT_AFTER="$(git log -1 --format=%ct FETCH_HEAD)"
          echo "기다릴 판: ${WAIT_FOR_SHA:-없음} · 이 시각 뒤에 켜진 앱: ${WAIT_FOR_BOOT_AFTER}"
          python warm_morning.py
