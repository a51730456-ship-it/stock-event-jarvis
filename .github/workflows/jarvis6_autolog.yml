# 자비스6 자동 기록 — 사람이 안 눌러도 매일 자료가 쌓이게 한다.
#
# 2026-07-26 사용자 지시: "그냥 니가 자동으로 눌러라고 필요한 시간에".
# 클릭 한 번도 매일 하기는 어렵다. 안 누르면 기록이 영영 0건이고, 0건이면
# 이 매매가 되는지 안 되는지 끝까지 모른다.
#
# 주문이 아니다. 종이에 적어 두는 것뿐이고 돈이 오가지 않는다.
#
# cron은 UTC고 한국시각은 +9시간이다. 05:35 UTC = 14:35 KST.
#
# 왜 15:15가 아니라 14:35에 깨우나: 예약 실행은 GitHub 사정으로 5~20분 늦게
# 시작한다. 15:10에 걸면 20분 늦는 날 15:30이 되어 **그날은 통째로 못 남긴다.**
# 그래서 일찍 깨워서 작업 안에서 15:15까지 기다렸다가 남긴다. 늦게 출발해도
# 15:15 전에만 시작하면 된다.
#
# 그래도 늦어 15:18을 넘기면 스크립트가 스스로 **남기지 않는다** —
# 종가를 보고 종가에 샀다고 적으면 검증이 아니라 속임수가 된다.
name: 자비스6 자동 기록

on:
  schedule:
    - cron: "35 5 * * 1-5"    # 월~금 05:35 UTC = 14:35 KST
  workflow_dispatch:
    inputs:
      allow_any_time:
        description: "장 시간이 아니어도 돌릴지 (시험용)"
        type: boolean
        default: false

concurrency:
  group: jarvis6-autolog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autolog:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 14:35에 깨어나 15:15까지 기다리므로 넉넉히 둔다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 것만 설치
        # 화면(streamlit)은 필요 없다. 자비스4가 일봉은 FinanceDataReader로,
        # 일부 지표는 yfinance로 받으므로 둘 다 넣는다 — 빠뜨리면 장중에
        # 그 함수까지 갔을 때만 터져서 알아채기 어렵다.
        run: pip install requests pandas finance-datareader yfinance

      - name: 15시 15분까지 기다렸다가 기록 남기기
        run: |
          # 장 막판에 재는 것이 이 매매의 전부다. 14:35에 깨어났어도 바로 남기면
          # 다른 매매가 된다. 15:15까지 기다린다.
          #
          # 10# 을 붙이는 이유: 09:10은 "0910"이고 셸은 0으로 시작하는 수를
          # 8진수로 읽어 9가 들어가면 통째로 터진다.
          # 15:15을 이미 넘겼으면 기다리지 않고 바로 간다. 15:18까지면 남기고,
          # 넘었으면 스크립트가 스스로 거른다.
          while [ "$((10#$(TZ=Asia/Seoul date +%H%M)))" -lt 1515 ]; do
            echo "한국시각 $(TZ=Asia/Seoul date +%H:%M) — 15:15까지 기다립니다"
            sleep 60
          done
          python jarvis6_autolog.py --export-dir data/jarvis6 \
            ${{ inputs.allow_any_time && '--allow-any-time' || '' }}

      - name: 저장소에 올리기
        if: always()
        run: |
          git config user.name "jarvis6-autolog"
          git config user.email "jarvis6-autolog@users.noreply.github.com"
          git add data/jarvis6 || true
          if ! git diff --cached --quiet; then
            git commit -m "자비스6 자동 기록 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "남길 것이 없습니다 (조건을 채운 종목이 없는 날일 수 있습니다)"
          fi
