# 안드로이드 설치 파일(APK) 만들기 (2026-11-04 상하님 — 「카톡으로 보내면 바탕화면에 어플이 생기게」 · 「하나만 · 미국테마에서 한국테마로」).
# 아이콘 하나 「자비스」 → 온라인 앱 자비스12(한국테마는 그 안 「🌏 한국테마 →」). 설계도는 research/j13_android_build.py.
# 비밀번호는 안 넣는다(저장소 공개). 서명 열쇠는 이 실행 안에서만 만들고 버린다. 결과는 따로 갈래(j13-android)에만 올린다 — master 그대로.
name: 자비스 안드로이드 설치 파일

on:
  push:
    branches: [master-a283cq]
    paths:
      - research/j13_android_build.py
      - .github/workflows/j13_android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: j13-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: 설계도 만들기
        run: |
          pip install pillow
          python research/j13_android_build.py "$RUNNER_TEMP/jarvis"
          python research/j13_android_build.py "$RUNNER_TEMP/jarvischeck" --check
      # 서명 열쇠를 **고정**한다(2026-11-05 — 판마다 새 열쇠라 새 판을 깔 때마다 앱을 지워야 했다 · 상하님 「새 판 받기 안 된다」).
      # 열쇠 파일은 따로 갈래(j13-android-key)에 두고, 깃허브 비밀 값(DART_API_KEY)에서 만든 암호로 잠근다 — 암호는 어디에도 안 찍힌다.
      # 열쇠 갈래가 없을 때만 새로 만든다(덮어쓰지 않는다). 비밀 값이 바뀌어 못 열면 멈춘다(말없이 새 열쇠로 바꾸면 또 지워야 한다).
      - name: 서명 열쇠(고정)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -e
          if [ -z "$DART_API_KEY" ]; then echo "깃허브 비밀 값이 없어 서명 열쇠를 열 수 없음" && exit 1; fi
          PASS="$(python -c 'import hashlib, os; print(hashlib.sha256(("jarvis-android-signing/v1:" + os.environ["DART_API_KEY"]).encode()).hexdigest())')"
          echo "::add-mask::$PASS"
          echo "JARVIS_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          echo "JARVIS_KEYSTORE=$RUNNER_TEMP/jarvis.p12" >> "$GITHUB_ENV"
          if git fetch -q origin j13-android-key 2>/dev/null; then
            git show origin/j13-android-key:jarvis-release.p12 > "$RUNNER_TEMP/jarvis.p12"
            keytool -list -keystore "$RUNNER_TEMP/jarvis.p12" -storetype PKCS12 -storepass "$PASS" -alias jarvis > /dev/null \
              || { echo "고정 열쇠를 못 엶 — 비밀 값이 바뀌었으면 j13-android-key 갈래를 지우고 다시 돌린다(그때 한 번 앱을 지우고 깔아야 함)"; exit 1; }
            echo "고정 열쇠로 서명"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/jarvis.p12" -storetype PKCS12 -alias jarvis -keyalg RSA -keysize 3072 \
              -validity 20000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Jarvis"
            mkdir -p "$RUNNER_TEMP/keybranch"
            cp "$RUNNER_TEMP/jarvis.p12" "$RUNNER_TEMP/keybranch/jarvis-release.p12"
            printf '%s\n' "자비스 안드로이드 서명 열쇠(잠김). 암호는 깃허브 비밀 값에서만 만든다 — 이 갈래를 지우면 다음 판부터 앱을 한 번 지우고 깔아야 한다." \
              > "$RUNNER_TEMP/keybranch/README.txt"
            cd "$RUNNER_TEMP/keybranch"
            git init -q -b j13-android-key
            git config user.name "j13-android"
            git config user.email "j13-android@users.noreply.github.com"
            git add .
            git commit -q -m "자비스 안드로이드 서명 열쇠(잠김) $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" j13-android-key
            echo "고정 열쇠를 새로 만들어 j13-android-key 에 둠"
          fi
      - name: 설치 파일 만들기
        working-directory: ${{ runner.temp }}/jarvis
        run: gradle --no-daemon assembleRelease
      - name: 가상 폰 시험판 만들기(✕ · 새 창 링크를 실제로 눌러 보는 판 · 상하님께는 안 감)
        working-directory: ${{ runner.temp }}/jarvischeck
        run: gradle --no-daemon assembleRelease
      - name: 만든 것 확인 · 앞 판과 서명 견주기
        run: |
          APK="$RUNNER_TEMP/jarvis/app/build/outputs/apk/release/app-release.apk"
          ls -la "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|launchable-activity|application-label" || true
          # 지금 올라 있는 앞 판을 받아 서명 지문을 견준다 — 같아야 지우지 않고 덮어 깔린다(2026-11-05)
          mkdir -p "$RUNNER_TEMP/prev"
          if curl -sfL -o "$RUNNER_TEMP/prev/prev.apk" "https://github.com/${GITHUB_REPOSITORY}/raw/j13-android/jarvis.apk"; then
            NEW_FP="$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256' | awk '{print $NF}')"
            OLD_FP="$("$BT/apksigner" verify --print-certs "$RUNNER_TEMP/prev/prev.apk" | grep -m1 'SHA-256' | awk '{print $NF}')"
            echo "앞 판 서명 ${OLD_FP:0:16}… · 새 판 서명 ${NEW_FP:0:16}…"
            if [ "$NEW_FP" = "$OLD_FP" ]; then echo "서명 같음 — 덮어 깔림" | tee "$RUNNER_TEMP/prev/sign.txt"; else echo "서명 다름 — 앞 판을 지우고 깔아야 함" | tee "$RUNNER_TEMP/prev/sign.txt"; fi
          else
            echo "앞 판 없음" | tee "$RUNNER_TEMP/prev/sign.txt"
          fi
      - name: 앞 판 넘기기(가상 폰에서 덮어 깔기 시험)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-prev-apk
          path: ${{ runner.temp }}/prev
          if-no-files-found: ignore
      - name: 가상 폰 확인용으로 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: ${{ runner.temp }}/jarvis/app/build/outputs/apk/release/app-release.apk
      - name: 가상 폰 시험판 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-check-apk
          path: ${{ runner.temp }}/jarvischeck/app/build/outputs/apk/release/app-release.apk
      - name: 따로 갈래(j13-android)에 올리기
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/jarvis/app/build/outputs/apk/release/app-release.apk" "$RUNNER_TEMP/out/jarvis.apk"
          cd "$RUNNER_TEMP/out"
          cat > 받는법.txt <<'EOF'
          자비스 안드로이드 앱
          1. 폰에서 이 주소를 엽니다: https://github.com/a51730456-ship-it/stock-event-jarvis/raw/j13-android/jarvis.apk
          2. 받은 jarvis.apk 를 누릅니다 → 「출처를 알 수 없는 앱」 허용 → 설치.
          3. 바탕화면 「자비스」 아이콘 → 미국테마. 맨 위 「🌏 한국테마 →」 → 한국테마.
          4. 처음 한 번 비밀번호를 칩니다(로그인은 앱 안에 남습니다).
          ※ 판 5 이하를 깔아 두셨으면 그 앱을 한 번 지우고 까십시오(서명이 바뀜). 그다음 판부터는 지우지 않고 그냥 까시면 덮어 깔립니다.
          EOF
          git init -q -b j13-android
          git config user.name "j13-android"
          git config user.email "j13-android@users.noreply.github.com"
          git add .
          git commit -q -m "자비스 안드로이드 설치 파일 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') · ${GITHUB_SHA::7} · 판 ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" j13-android

  # 가상 안드로이드 폰(안드로이드 14)에 깔고 열어 사진을 찍는다 — 실제로 열리는지 · 로그인 칸이 나오는지 본다(보기만 · 비밀번호 안 침).
  # 사진은 따로 갈래(j13-android-check)에만 올린다.
  phone_check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-check-apk
          path: apkcheck
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-prev-apk
          path: apkprev
        continue-on-error: true
      - name: 가상 폰 켤 준비
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p shots
      - name: 시험판 누르기 순서 쓰기(실행기가 한 줄씩 따로 돌려 파일로 넘김)
        run: |
          cat > check.sh <<'SH'
          set -x
          # ── 시험판: 작은 창(iframe) 안에서 새 창 링크 · ✕ 다리 · 둘째 길을 실제로 눌러 본다(2026-11-05) ──
          P=io.github.stockeventjarvis.app
          adb install -r apkcheck/app-release.apk
          adb shell wm size > shots/check_size.txt
          H=$(adb shell wm size | tr -dc '0-9x\n' | tail -1 | cut -dx -f2); W=$(adb shell wm size | tr -dc '0-9x\n' | tail -1 | cut -dx -f1)
          echo "W=$W H=$H" >> shots/check_size.txt
          adb logcat -c
          adb shell am start -W -n $P/.MainActivity; sleep 8
          adb exec-out screencap -p > shots/check_1_open.png
          adb shell input tap $((W/2)) $((H*15/100)); sleep 6
          adb exec-out screencap -p > shots/check_2_link.png
          adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|mResumedActivity' > shots/check_link_pid.txt || true
          adb shell am start -W -n $P/.MainActivity; sleep 6
          adb shell input tap $((W/2)) $((H*48/100)); sleep 5
          adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|mResumedActivity' > shots/check_bridge_pid.txt || true
          adb shell dumpsys activity recents | grep -c 'stockeventjarvis' >> shots/check_bridge_pid.txt || true
          adb shell am start -W -n $P/.MainActivity; sleep 8
          adb shell input tap $((W/2)) $((H*82/100)); sleep 5
          adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|mResumedActivity' > shots/check_exitlink_pid.txt || true
          adb shell dumpsys activity recents | grep -c 'stockeventjarvis' >> shots/check_exitlink_pid.txt || true
          adb logcat -d -s JarvisWeb:V ActivityManager:I > shots/check_logcat.txt || true
          {
            echo "새 창 링크 → 밖으로 엶: $(grep -c '밖으로 엶 https://example.com/jarvis-link-check' shots/check_logcat.txt)"
            echo "작은 창 안 다리: $(grep -o 'check frame JarvisApp=[a-z]* top=[a-z]* ua=[a-z]*' shots/check_logcat.txt | head -1)"
            echo "링크 누른 뒤 맨 앞 화면(브라우저여야): $(cat shots/check_link_pid.txt)"
            echo "다리 누른 뒤 맨 앞 화면(자비스가 아니어야) · 최근 앱 목록의 자비스 수: $(cat shots/check_bridge_pid.txt | tr '\n' ' ')"
            echo "둘째 길 누른 뒤 맨 앞 화면 · 최근 앱 목록의 자비스 수: $(cat shots/check_exitlink_pid.txt | tr '\n' ' ')"
            echo "끝냄 기록: $(grep -c '끝냄' shots/check_logcat.txt)"
          } > shots/check_result.txt
          cat shots/check_result.txt
          SH
      - name: 덮어 깔기 시험 순서 쓰기
        run: |
          cat > update_check.sh <<'SH'
          # 앞 판을 먼저 깔고, 그 위에 새 판을 지우지 않고 덮어 깔아 본다(서명이 같아야 됨)
          if [ -f apkprev/prev.apk ]; then
            adb install apkprev/prev.apk > shots/update_prev.txt 2>&1 || true
            if adb install -r apk/app-release.apk > shots/update_new.txt 2>&1; then echo "덮어 깔기 됨" > shots/update_result.txt; else echo "덮어 깔기 안 됨: $(tail -1 shots/update_new.txt)" > shots/update_result.txt; fi
            adb uninstall io.github.stockeventjarvis.app > /dev/null 2>&1 || true
          else
            echo "앞 판 없음" > shots/update_result.txt
          fi
          cat apkprev/sign.txt >> shots/update_result.txt 2>/dev/null || true
          cat shots/update_result.txt
          SH
      - name: 깔고 열어 사진 찍기
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash ./update_check.sh
            adb install -r apk/app-release.apk
            adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER io.github.stockeventjarvis.app > shots/launcher.txt
            adb shell am start -W -n io.github.stockeventjarvis.app/.MainActivity
            sleep 45
            adb exec-out screencap -p > shots/open_45s.png
            sleep 45
            adb exec-out screencap -p > shots/open_90s.png
            adb shell pidof io.github.stockeventjarvis.app > shots/running.txt || echo "꺼짐" > shots/running.txt
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml shots/ui.xml || echo "글자 목록 못 뽑음" > shots/ui.xml
            adb logcat -d -s JarvisWeb:V chromium:W cr_AwContents:W ActivityManager:W > shots/logcat.txt || true
            adb shell dumpsys webviewupdate | head -20 > shots/webview.txt || true
            bash ./check.sh
      - name: 사진만 따로 갈래(j13-android-check)에 올리기
        if: always()
        run: |
          cd shots
          ls -la
          cat launcher.txt running.txt webview.txt check_result.txt update_result.txt || true
          tail -60 logcat.txt || true
          git init -q -b j13-android-check
          git config user.name "j13-android"
          git config user.email "j13-android@users.noreply.github.com"
          git add .
          git commit -q -m "가상 폰 확인 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') · ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" j13-android-check
