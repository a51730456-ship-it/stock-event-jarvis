# 자비스12 관심종목 「넣은 날부터 성적」을 실제 미국 시세로 확인한다 (2026-10-31 상하님 「자비스12에도 넣어라」 · 「만들어라」).
# 클라우드 작업 칸은 야후가 막혀 시세가 안 들어온다 — 깃허브 컴퓨터에서 앱을 띄워 본다.
# 저장소에는 아무것도 쓰지 않는다(읽기 권한만). 비밀번호 파일과 기록 DB 는 이 실행 안에서만 임시로 만든다(올리지 않는다).
name: 자비스12 화면 확인

on:
  push:
    branches: [master-a283cq]
    paths:
      - jarvis12_watch_since.py
      - research/j12_screen_check.py
      - .github/workflows/j12_screen_check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j12-screen-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: 이 실행에서만 쓰는 비밀번호 파일 · 임시 기록 DB(관심종목 셋을 지난 날짜로)
        run: |
          mkdir -p db .streamlit
          python -c "import secrets; print('APP_PASSWORD = \"' + secrets.token_hex(16) + '\"')" > .streamlit/secrets.toml
          python research/j12_screen_check.py seed
      - name: 앱 띄우기
        run: |
          nohup streamlit run app.py --server.port 8501 --server.headless true > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8501/ > /dev/null && break; sleep 2; done
      - name: 자비스12 관심종목 확인
        env:
          J12_OUT: ${{ runner.temp }}/j12shots
        run: python research/j12_screen_check.py
      - name: 결과 남기기
        if: always()
        run: cp "$RUNNER_TEMP/app.log" "$RUNNER_TEMP/j12shots/" 2>/dev/null || true
      - name: 사진 · 기록 첨부
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j12-screen-check
          path: ${{ runner.temp }}/j12shots
          retention-days: 14
