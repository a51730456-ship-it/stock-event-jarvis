# 한국 급락 「그림자 목록」 저장 (2026-10-31 상하님 「라 로 해라」).
# 화면의 급락 목록은 그대로 두고, 미리 적어 둔 규칙(docs/KR_THEME_SPEC.md 3-4 「그림자 목록」)으로 고른 목록을 날짜와 함께 쌓는다.
# 코스피가 국면 안에서 새 바닥을 찍은 날에만 data/picklist_shadow/{날짜}.KR.json 을 새로 써서 올린다 — 신호 없는 날은 올리지 않는다
# (올릴 때마다 온라인 앱이 한 번 껐다 켜지므로 · CLAUDE.md 10-2). 지우지 않는다. 비밀번호·열쇠는 쓰지 않는다.
name: 자비스13 그림자 목록 저장

on:
  schedule:
    - cron: "40 7 * * 1-5"    # 16:40 KST — 한국장 종가가 확정된 뒤
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: j13-shadow-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install pandas==2.3.3 numpy requests lxml html5lib beautifulsoup4 finance-datareader==0.9.202
      - name: 그림자 목록 고르기
        run: python research/j13_shadow_collect.py
      - name: 저장소에 올리기 (신호 난 날만)
        run: |
          git config user.name "j13-shadow-collector"
          git config user.email "j13-shadow-collector@users.noreply.github.com"
          git add data/picklist_shadow || true
          if git diff --cached --quiet; then
            echo "오늘은 새로 쓸 것이 없어 올리지 않습니다"
            exit 0
          fi
          git commit -m "그림자 목록 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((i * 10))
          done
          echo "올리기 실패" && exit 1
