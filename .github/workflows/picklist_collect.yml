# 네 갈래 목록을 하루 한 번 저장한다 (2026-08-09 상하님 지시).
#
# "매수 시점 리스트를 그대로 옮겨 놓아라 — 시간이 지나서 맞아떨어지는지 보게."
# "내가 로그인하지 않아도 자동으로 저장되게 해라."
#
# 뒤쪽이 이 파일의 존재 이유다. 화면(Streamlit)은 사람이 들어와야 도니까, 상하님이
# 안 들어온 날은 자료가 통째로 빈다. 자비스5 수집(jarvis5_collect.yml)과 같은 방식으로
# GitHub 컴퓨터가 장 마감 뒤에 대신 돌려 저장소에 올린다.
#
# cron은 UTC다. 한국시각 = UTC + 9.
#   한국장: 07:10 UTC = 16:10 KST — 코스피 마감(15:30) 뒤 넉넉히
#   미국장: 21:30 UTC = 다음날 06:30 KST — 뉴욕 마감(16:00 ET) 뒤 30분
# 미국 쪽은 뉴욕 날짜로 적히므로(picklist_store.trade_date_for) 서울 날짜가 넘어가도
# 하루 밀리지 않는다.
#
# 예약 실행은 GitHub 사정으로 늦게 시작될 수 있다. 늦어도 그날 마감값이므로
# 목록은 같다.
name: 날짜별 목록 저장

on:
  schedule:
    - cron: "10 7 * * 1-5"    # 월~금 16:10 KST — 한국장 마감 뒤
    - cron: "30 21 * * 1-5"   # 월~금 06:30 KST(다음날) — 미국장 마감 뒤
    # **한 번 더 깨운다** (2026-08-28). 깃허브는 예약을 몇 시간씩 미루고, 아예
    # 안 띄우는 날도 있다(2026-08-26 미국 몫이 그랬다). 한 번 더 두면 앞의 것이
    # 빠져도 그날 자료가 남는다. 앞의 것이 이미 찍었으면 같은 값이라 덮어써도
    # 그대로다(수집기가 줄이 줄면 안 덮어쓴다).
    - cron: "0 9 * * 1-5"     # 월~금 18:00 KST — 한국 몫 두 번째
    - cron: "0 1 * * 2-6"     # 화~토 10:00 KST — 미국 몫 두 번째
                              # (미국장은 22:30 KST 에 다시 여니 그 전이다)
  workflow_dispatch:
    inputs:
      market:
        description: "어느 시장을 찍을지 (US · KR · both)"
        required: false
        default: "both"

concurrency:
  # 두 판이 같은 파일을 동시에 밀면 한쪽이 사라진다. 뒤에 온 쪽을 기다리게 한다.
  group: picklist-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 것만 설치
        # 목록을 만드는 데 필요한 것만 받는다 — streamlit은 화면용이라 안 받는다.
        run: pip install -r requirements.txt

      - name: 어느 시장인지 정하기
        id: plan
        # ── **어느 예약이 깨웠는지로 고른다. 시계로 고르면 안 된다** (2026-08-28) ──
        # 상하님 지적 — "8월 27일은 저장해 둔 목록에 상승장밖에 없냐?"
        #
        # 까닭이 여기였다. 예전에는 **지금 몇 시인지**로 골랐다(20시 넘으면 미국).
        # 그런데 깃허브는 예약을 제때 안 띄우고 몇 시간씩 미룬다. 미국 몫(21:30 UTC)이
        # 자정을 넘겨 뜨면 시각이 0시라 **한국 몫으로 돌아 버린다.**
        #
        # 실제로 그랬다(실행 기록) —
        #   08-25 21:52 → 21시 → US ○
        #   08-26 (21:30 예약이 08-27 00:56 에 뜸) → 0시 → **KR** ✕  미국 안 찍힘
        #   08-27 (07:10 예약이 18:14 에 뜸)      → 18시 → KR, 게다가 실패
        # 그래서 미국 목록이 이틀 통째로 비었다.
        #
        # 깃허브는 **어느 cron이 깨웠는지**를 `github.event.schedule` 로 알려 준다.
        # 그것으로 고르면 몇 시간이 밀려도 안 어긋난다. 시계는 맨 뒤에만 남긴다
        # (손으로 돌릴 때처럼 예약 정보가 없는 판을 위해서다).
        run: |
          if [ -n "${{ inputs.market }}" ]; then
            MARKET="${{ inputs.market }}"
          else
            case "${{ github.event.schedule }}" in
              "30 21 * * 1-5"|"0 1 * * 2-6") MARKET="US" ;;
              "10 7 * * 1-5"|"0 9 * * 1-5")  MARKET="KR" ;;
              *)
                # 예약 정보가 없는 판(손으로 돌린 때)만 시계를 본다.
                if [ "$(date -u +%H)" -ge 20 ]; then MARKET="US"; else MARKET="KR"; fi ;;
            esac
          fi
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "한국시각 $(TZ=Asia/Seoul date +'%m-%d %H:%M') · $MARKET 목록을 찍습니다"

      - name: 목록 찍기
        # **한 번 실패하면 5분 뒤에 다시 한다.** 미국은 yfinance를 쓰는데 클라우드
        # IP가 잠깐 거절당하는 일이 있다(이 저장소에서 겪은 적 있다). 잠깐 막힌 것
        # 때문에 그날 목록이 통째로 비면 나중에 성적을 잴 자료에 구멍이 난다.
        # 두 번째도 실패하면 작업이 빨갛게 뜬다 — 조용히 빈 날이 쌓이는 것보다 낫다.
        run: |
          MARKET="${{ steps.plan.outputs.market }}"
          if python picklist_collector.py --market "$MARKET"; then
            exit 0
          fi
          echo "첫 시도 실패 — 5분 뒤 한 번 더 합니다"
          sleep 300
          python picklist_collector.py --market "$MARKET"

      - name: 저장소에 올리기
        if: always()
        run: |
          git config user.name "picklist-collector"
          git config user.email "picklist-collector@users.noreply.github.com"
          git add data/picklist || true
          if ! git diff --cached --quiet; then
            git commit -m "목록 저장 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') ${{ steps.plan.outputs.market }}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "바뀐 것이 없어 올리지 않습니다"
          fi
