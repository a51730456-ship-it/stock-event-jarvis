# 분산일이 미국 나스닥 종합·S&P 500 에서 뜻이 있었나 — 12년치로 잰다 (2026-10-31 상하님 「자비스12에도 넣어라」 · 「만들어라」).
# 클라우드 작업 칸은 야후가 막혀 못 잰다 — 깃허브 컴퓨터에서 돌려 결과를 실행 기록과 첨부 파일에 남긴다.
# 저장소에는 아무것도 쓰지 않는다(읽기 권한만). 자비스13 과 같은 셈(jarvis13_market.distribution_days)으로 센다.
# 재기만 한다 — 화면에 넣을지·문턱을 그릴지는 숫자를 보여 드린 뒤 여쭙는다(CLAUDE.md 0-1).
name: 자비스12 미국 분산일 재기

on:
  push:
    branches: [master-a283cq]
    paths:
      - research/j12_distribution_measure.py
      - .github/workflows/j12_distribution.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j12-distribution
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 나스닥 종합 · S&P 500 분산일 재기
        env:
          J12_OUT: ${{ runner.temp }}/j12dist
        run: python research/j12_distribution_measure.py
      - name: 결과 파일 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j12-distribution
          path: ${{ runner.temp }}/j12dist
          retention-days: 30
