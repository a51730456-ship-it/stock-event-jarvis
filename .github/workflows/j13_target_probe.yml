name: 자비스13 목표주가 자료 살펴보기

# 한국 목표주가 최저 · 최고를 어디서 받을 수 있는지 살펴보는 시험 — 찍기만 한다(파일 안 씀 · 화면 · 점수와 무관).
on:
  push:
    branches: [master-a283cq]
    paths:
      - research/j13_target_probe.py
      - .github/workflows/j13_target_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 삼성전자
        run: python research/j13_target_probe.py 005930
      - name: SK이노베이션
        run: python research/j13_target_probe.py 096770
